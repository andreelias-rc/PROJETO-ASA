option domain-name "andre.devops";
option domain-name-servers 192.168.56.124;

default-lease-time 180;
max-lease-time 3600;
ddns-update-style none;
authoritative;

subnet 192.168.56.0 netmask 255.255.255.0 {
    range 192.168.56.50 192.168.56.100;
    option routers 192.168.56.1;
    option subnet-mask 255.255.255.0;
}

host db {
    hardware ethernet 08:00:27:3a:00:01;
    fixed-address 192.168.56.125;
}

host app {
    hardware ethernet 08:00:27:3a:00:02;
    fixed-address 192.168.56.126;
}
